name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }} # runs job three times, once per OS
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest] # linux, MacOS, Windows

    steps:
      - uses: actions/checkout@v4 # clones repo onto runner, easier than shell command

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          find include src apps tests \( -name '*.cpp' -o -name '*.hpp' \) \
            | xargs clang-format --dry-run --Werror
